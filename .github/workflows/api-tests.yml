name: API tests

on:
  push:
    branches: [main]
    paths: ['sqa/api-testing/**', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['sqa/api-testing/**', '.github/workflows/api-tests.yml']
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: sqa/api-testing

jobs:
  selftest-mock:
    name: Framework self-test (local mock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sqa/api-testing/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - name: Start mock and run tests
        env:
          BASE_URL: http://127.0.0.1:3001
        run: |
          python tools/mock_booker.py 3001 &
          sleep 1
          pytest

  real-target:
    name: Tests on the real practice API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sqa/api-testing/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Summarize
        if: always()
        working-directory: .
        run: python sqa/05-reports/generate_summary.py --junit sqa/api-testing/reports/junit.xml --out "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-reports
          path: sqa/api-testing/reports/
          retention-days: 14
