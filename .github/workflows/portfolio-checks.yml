name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Traceability and consistency (non-strict)
        run: python scripts/portfolio_status.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: AI-test precision
        run: python sqa/ai-testing/precision.py
